---
- name: Prepare homelab hosts
  hosts: homelab_servers
  become: true
  gather_facts: true

  roles:
    - app_runtime

- name: Deploy applications
  hosts: homelab_servers
  become: true
  gather_facts: false

  vars:
    target_app: "{{ app | default('') }}"  # Optional: limit to single app

  roles:
    - apps
