---
# Systemd owns the persistent fence; there is no separate activation ledger.
# Install native /dev/null masks offline BEFORE starting the user manager,
# updating mounted configuration, or promoting any Quadlets.
- name: Require canonical persistent user unit directory for inactive masks
  ansible.builtin.command:
    argv: [realpath, -m, "{{ podman_home }}/.config/systemd/user"]
  register: inactive_mask_directory
  changed_when: false
  failed_when: >-
    inactive_mask_directory.rc != 0
    or inactive_mask_directory.stdout != podman_home ~ '/.config/systemd/user'
  when: app_apply_plan.inactive_services | length > 0

- name: Inspect inactive mask directory parents
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ podman_home }}/.config"
    - "{{ podman_home }}/.config/systemd"
    - "{{ podman_home }}/.config/systemd/user"
  register: inactive_mask_parents
  when: app_apply_plan.inactive_services | length > 0

- name: Require safe existing inactive mask directories
  ansible.builtin.assert:
    quiet: true
    that:
      - not item.stat.exists or (item.stat.isdir and not item.stat.islnk and item.stat.uid == podman_uid | int)
  loop: "{{ inactive_mask_parents.results | default([]) }}"
  when: app_apply_plan.inactive_services | length > 0
  loop_control:
    label: "{{ item.item }}"

- name: Create only missing inactive mask directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_group }}"
    mode: '0700'
  loop: "{{ inactive_mask_parents.results | default([]) }}"
  when:
    - app_apply_plan.inactive_services | length > 0
    - not item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Inspect selected inactive service mask paths
  ansible.builtin.stat:
    path: "{{ podman_home }}/.config/systemd/user/{{ item }}"
    follow: false
  loop: "{{ app_apply_plan.inactive_services }}"
  register: inactive_mask_paths

- name: Reject alternate units at inactive service mask paths
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        not item.stat.exists or
        (item.stat.islnk | default(false) and item.stat.lnk_source | default('') == '/dev/null'
         and item.stat.uid == podman_uid | int)
    fail_msg: "Refusing to replace an unexpected persistent service at {{ item.item }}."
  loop: "{{ inactive_mask_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Persistently mask selected inactive application services before manager activation
  ansible.builtin.file:
    src: /dev/null
    dest: "{{ podman_home }}/.config/systemd/user/{{ item }}"
    state: link
    follow: false
    owner: "{{ podman_user }}"
    group: "{{ podman_group }}"
  loop: "{{ app_apply_plan.inactive_services }}"

- name: Reverify storage immediately before user manager activation
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/verify_storage.yml"

- name: Prepare rootless user systemd manager after inactive masks exist
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/podman_user_systemd.yml"

- name: Load persistent inactive masks into the live user manager
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  changed_when: false
  when: app_apply_plan.inactive_services | length > 0

# Mask first: even a not-yet-installed Quadlet now has a known masked unit.
# Never force-kill containers as a fallback here.
- name: Stop selected inactive application services
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: stopped
    scope: user
  loop: "{{ app_apply_plan.inactive_services }}"
  loop_control:
    loop_var: service_name
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"

- name: Inspect inactive application containers before data preparation
  containers.podman.podman_container_info: {}
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  register: inactive_runtime_observation
  when: app_apply_plan.inactive_containers | length > 0

- name: Require inactive application writers to be stopped
  ansible.builtin.assert:
    quiet: true
    that:
      - not item.State.Running | default(false)
    fail_msg: >-
      Inactive container {{ item.Name }} is still running after its service was
      masked/stopped. Review unexpected writers before retrying; data was not staged.
  loop: >-
    {{ inactive_runtime_observation.containers | default([])
       | selectattr('Name', 'in', app_apply_plan.inactive_containers) | list }}
  loop_control:
    label: "{{ item.Name }}"
