---
# No container is started until all initialization markers are cleared.
# Recovery may initialize an existing root only with durable proof that this
# executor created it, and only while it is still empty.
- name: Record intent before creating volume root
  ansible.builtin.copy:
    content: "{{ volume_state.volume_dir | to_json }}\n"
    dest: "{{ volume_init_marker }}"
    owner: root
    group: root
    mode: '0600'
    force: false

- name: Read original volume initialization contract
  ansible.builtin.slurp:
    src: "{{ volume_init_marker }}"
  register: volume_init_contract

- name: Require unchanged initialization contract
  ansible.builtin.assert:
    quiet: true
    that:
      - volume_init_contract.content | b64decode | from_json == volume_state.volume_dir
    fail_msg: "An interrupted volume initialization has a changed contract; inspect it manually."

- name: Create missing volume root without modifying existing roots
  ansible.builtin.file:
    path: "{{ volume_state.volume_dir.path }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_group }}"
    mode: "{{ volume_state.volume_dir.mode }}"
  when: not volume_state.stat.exists

- name: Require empty root before initial ownership assignment
  ansible.builtin.command:
    argv: [find, "{{ volume_state.volume_dir.path }}", -mindepth, '1', -maxdepth, '1', -print, -quit]
  register: initializing_volume_contents
  changed_when: false
  failed_when: initializing_volume_contents.rc != 0 or initializing_volume_contents.stdout | length > 0

- name: Initialize rootless numeric ownership
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - chown
      - "{{ volume_state.volume_dir.initial_uid }}:{{ volume_state.volume_dir.initial_gid }}"
      - "{{ volume_state.volume_dir.path }}"
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  changed_when: true

- name: Commit volume initialization before any service starts
  ansible.builtin.file:
    path: "{{ volume_init_marker }}"
    state: absent
