---
- name: Compute desired secret hash
  ansible.builtin.set_fact:
    desired_secret_hash: >-
      {{ 'v2:' ~ ({
          'app': app_secret.app,
          'secret': app_secret.logical_name,
          'pepper': vault_secret_hash_pepper,
          'value': vault_podman_secrets[app_secret.app][app_secret.logical_name]
        } | to_json | hash('sha256')) }}
  no_log: true

- name: Read existing secret hash marker
  ansible.builtin.slurp:
    src: "{{ secret_hash_dir }}/{{ app_secret.physical_name }}.sha256"
  register: app_secret_hash_marker
  failed_when: false
  no_log: true

- name: Inspect existing Podman secret
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - "{{ app_secret.physical_name }}"
  register: app_secret_inspection
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  no_log: true

- name: Decide whether secret must be reconciled
  ansible.builtin.set_fact:
    app_secret_requires_update: >-
      {{ app_secret_inspection.rc != 0
         or (app_secret_hash_marker.content | default('') | b64decode | trim) != desired_secret_hash }}
  no_log: true

- name: Remove changed Podman secret
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - rm
      - "{{ app_secret.physical_name }}"
  register: removed_app_secret
  changed_when: removed_app_secret.rc == 0
  failed_when: removed_app_secret.rc != 0 and 'no such secret' not in removed_app_secret.stderr | lower
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  when: app_secret_requires_update
  no_log: true

- name: Create desired Podman secret
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - create
      - "{{ app_secret.physical_name }}"
      - "-"
    stdin: "{{ vault_podman_secrets[app_secret.app][app_secret.logical_name] }}"
    stdin_add_newline: false
  changed_when: true
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  when: app_secret_requires_update
  no_log: true

- name: Persist desired secret hash marker
  ansible.builtin.copy:
    content: "{{ desired_secret_hash }}\n"
    dest: "{{ secret_hash_dir }}/{{ app_secret.physical_name }}.sha256"
    owner: root
    group: root
    mode: "0600"
  when: app_secret_requires_update
  no_log: true

- name: Track secret changes
  ansible.builtin.set_fact:
    app_secrets_changed: "{{ app_secrets_changed or app_secret_requires_update }}"
  no_log: true
