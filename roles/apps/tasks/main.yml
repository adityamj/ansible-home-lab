---
# Steady-state only. Migration entry points may invoke this same pipeline.
# Static imports preserve task visibility for --list-tasks and syntax checks.

- name: Preflight application deployment
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare application deployment
  ansible.builtin.import_tasks: prepare.yml

- name: Fence selected inactive applications before data preparation
  ansible.builtin.import_tasks: fence_inactive.yml

- name: Stage application deployment
  ansible.builtin.import_tasks: stage.yml

- name: Validate application deployment
  ansible.builtin.import_tasks: validate.yml

- name: Apply application deployment
  ansible.builtin.import_tasks: apply.yml

- name: Finalize application deployment
  ansible.builtin.import_tasks: finalize.yml
