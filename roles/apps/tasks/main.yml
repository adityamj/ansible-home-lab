---
- name: Discover apps and build host data
  ansible.builtin.include_tasks: ../common/tasks/app_discovery.yml

- name: Prepare podman user systemd runtime
  ansible.builtin.include_tasks: ../common/tasks/podman_user_systemd.yml

- name: Ensure Caddy host baseline before app deployment
  ansible.builtin.include_role:
    name: caddy_host
  when: (host_apps | length) > 0

- name: Ensure app directories are discoverable
  ansible.builtin.assert:
    that:
      - apps_dirs | length > 0
    fail_msg: >-
      No app directories discovered under {{ apps_root_candidates }}/apps.
      Ensure you are running Ansible from the repo root and that
      `apps/<app>/app.yml` exists on the controller.
  delegate_to: localhost
  become: false
  run_once: true

- name: Set app sources root for this run
  ansible.builtin.set_fact:
    app_sources_root: "{{ (apps_dirs | first | dirname | dirname) }}"
  when: (apps_dirs | length) > 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Assert app sources root exists
  ansible.builtin.stat:
    path: "{{ app_sources_root }}/apps"
  register: app_sources_root_stat
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure app sources root is valid
  ansible.builtin.assert:
    that:
      - app_sources_root | length > 0
      - app_sources_root_stat.stat.exists
      - app_sources_root_stat.stat.isdir
    fail_msg: >-
      Unable to resolve controller app sources root. Expected apps directory under
      {{ app_sources_root | default('<unset>') }}.
  delegate_to: localhost
  become: false
  run_once: true

- name: Validate requested target app exists
  ansible.builtin.assert:
    that:
      - (target_app | trim) in (apps_list | map(attribute='name') | list)
    fail_msg: "Requested target_app '{{ target_app }}' does not exist in app definitions."
  when:
    - target_app is defined
    - target_app is string
    - target_app | trim | length > 0
  run_once: true

- name: Filter to target app on this host when provided
  ansible.builtin.set_fact:
    host_apps: "{{ host_apps | selectattr('name', 'equalto', target_app) | list }}"
  when:
    - target_app | default('') | string | trim | length > 0

- name: Filter apps with containers
  ansible.builtin.set_fact:
    host_container_apps: "{{ host_apps | selectattr('containers', 'defined') | selectattr('containers', 'ne', []) | list }}"

- name: Initialize change trackers
  ansible.builtin.set_fact:
    caddy_config_changed: "{{ caddy_global_config_changed | default(false) }}"
    caddy_network_changes: false
    caddy_reload_needed: false
    caddy_service_restart_needed: "{{ caddy_service_restart_needed | default(false) }}"
    quadlet_units_changed: false
    app_services_to_restart: []
  when: (host_apps | length) > 0

- name: Deploy app
  ansible.builtin.include_tasks: deploy_app.yml
  loop: "{{ host_apps }}"
  loop_control:
    loop_var: app
  when: (host_apps | length) > 0

- name: Reload systemd user daemon for podman user
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  changed_when: false
  when:
    - (host_apps | length) > 0
    - quadlet_units_changed | default(false)

- name: Check if Caddy container is running
  containers.podman.podman_container_info:
    name: caddy
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  register: caddy_info
  changed_when: false
  failed_when: false
  when: (host_apps | length) > 0

- name: Collect Caddy attached networks
  ansible.builtin.set_fact:
    caddy_attached_networks: >-
      {{
        (caddy_info.containers | default([]) | first).NetworkSettings.Networks
        | default({})
        | dict2items
        | map(attribute='key')
        | list
      }}
  when:
    - (host_apps | length) > 0
    - (host_ingress_networks | length) > 0
    - (caddy_info.containers | default([])) | length > 0

- name: Calculate missing ingress networks for Caddy
  ansible.builtin.set_fact:
    caddy_missing_networks: "{{ host_ingress_networks | difference(caddy_attached_networks | default([])) }}"
  when:
    - (host_apps | length) > 0
    - (host_ingress_networks | length) > 0
    - (caddy_info.containers | default([])) | length > 0

- name: Attach Caddy to missing ingress networks
  containers.podman.podman_container:
    name: caddy
    state: started
    network: "{{ item }}"
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  register: caddy_attach_results
  loop: "{{ caddy_missing_networks | default([]) }}"
  when:
    - (host_apps | length) > 0
    - (caddy_missing_networks | default([]) | length) > 0
    - (caddy_info.containers | default([])) | length > 0

- name: Track Caddy network changes
  ansible.builtin.set_fact:
    caddy_network_changes: >-
      {{
        caddy_network_changes | default(false)
        or (
          caddy_attach_results.results | default([])
          | selectattr('changed')
          | list
          | length > 0
        )
      }}
  when: caddy_attach_results is defined

- name: Set Caddy reload flag
  ansible.builtin.set_fact:
    caddy_reload_needed: >-
      {{
        (caddy_config_changed or caddy_network_changes)
        and not (caddy_service_restart_needed | default(false))
      }}
  when: (host_apps | length) > 0

- name: Validate Caddy configuration
  ansible.builtin.command: >-
    podman run --rm
    -v {{ caddy_config_dir }}:/etc/caddy:ro
    {{ caddy_image }}
    caddy validate --config /etc/caddy/Caddyfile
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  changed_when: false
  when:
    - (host_apps | length) > 0
    - caddy_config_changed | default(false)

- name: Reload Caddy after app updates
  ansible.builtin.systemd:
    name: "{{ caddy_unit_name }}"
    state: reloaded
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  when:
    - (host_apps | length) > 0
    - caddy_reload_needed | default(false)
    - (caddy_info.containers | default([])) | length > 0

- name: Enable app services
  ansible.builtin.systemd:
    name: "{{ item.0.name }}-{{ item.1.name }}.service"
    enabled: true
    state: started
    scope: user
  loop: "{{ host_container_apps | subelements('containers') }}"
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  when: (host_container_apps | length) > 0

- name: Restart changed app services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    scope: user
  loop: "{{ app_services_to_restart | default([]) | unique }}"
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  when: (app_services_to_restart | default([]) | length) > 0

- name: Restart Caddy after Quadlet updates
  ansible.builtin.systemd:
    name: "{{ caddy_unit_name }}"
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_systemd_env }}"
  when:
    - (host_apps | length) > 0
    - caddy_service_restart_needed | default(false)
    - (caddy_info.containers | default([])) | length > 0
