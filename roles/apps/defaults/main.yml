---
# Podman user/group (should match app_runtime)
podman_user: podman
podman_group: podman

# Base directory for all persistent data
# (override in group_vars/all/main.yml)
data_mount: "/srv/data"

# Base directory for app data
app_data_base_path: "{{ data_mount }}/apps"

# Controller path to app definitions directory.
# Defaults to "apps" for backward compatibility; override with an absolute path in control repos.
apps_root: "apps"

# Static files base path (read-only mount in Caddy)
static_base_path: "{{ data_mount }}/static"

# Caddy config directory for site configs
caddy_config_dir: "{{ data_mount }}/system/ingress/caddy/config"

# Caddy container image (for validation)
caddy_image: "docker.io/library/caddy:2-alpine"

# Caddy container user (for ownership fix)
caddy_container_user: "0:0"

# Default ingress health/retry tuning for app backends.
# These are only applied when a container declares a healthcheck block.
app_healthcheck_defaults:
  path: "/health"
  interval: "2s"
  timeout: "1s"
  passes: 2
  fails: 1
  status: 200
  retry_duration: "20s"
  retry_interval: "500ms"
  fail_duration: "30s"
  max_fails: 1
  unhealthy_status:
    - "5xx"

# Default runtime healthcheck settings for Quadlet containers.
# Rendered only when a container defines runtime_healthcheck.
app_runtime_healthcheck_defaults:
  interval: "30s"
  timeout: "10s"
  retries: 3
  start_period: "20s"
  on_failure: "kill"

# Optional: limit deployment to a single app
# target_app: ""
