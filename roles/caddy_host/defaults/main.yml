---
# Podman user/group (should match app_runtime)
podman_user: podman
podman_group: podman

# Caddy container image
caddy_image: "docker.io/library/caddy:2-alpine"

# Base directory for all persistent data
# (override in group_vars/all/main.yml)
data_mount: "/srv/data"

# Caddy directories
caddy_config_dir: "{{ data_mount }}/system/ingress/caddy/config"
caddy_data_dir: "{{ data_mount }}/system/ingress/caddy/data"
caddy_config_storage_dir: "{{ data_mount }}/system/ingress/caddy/storage"
caddy_log_dir: "{{ data_mount }}/system/ingress/caddy/logs"

# ACME email for Let's Encrypt
caddy_admin_email: ""

# Static files base path (read-only mount for serving static content)
static_base_path: "{{ data_mount }}/static"
caddy_static_mount_path: /srv/static

# Controller path to app definitions directory
apps_root: "{{ playbook_dir }}/apps"

# Resource limits for Caddy container
caddy_memory_max: "512M"
caddy_pids_limit: 512
caddy_cpu_quota: "30%"
caddy_cpu_weight: 2048

# Default systemd restart behavior for the Caddy Quadlet service.
caddy_restart_policy: "on-failure"
caddy_restart_sec: "5s"

caddy_host_staging_dir: /var/lib/ansible-app-host/caddy
caddy_platform_network: caddy-egress-net
apps_control_state_dir: /var/lib/ansible-app-host
podman_user_unit_dir: /etc/systemd/user
caddy_host_quadlet_generator_paths:
  - /usr/lib/systemd/system-generators/podman-system-generator
  - /usr/local/lib/systemd/system-generators/podman-system-generator
