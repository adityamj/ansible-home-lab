---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

- name: Restart fail2ban after config
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  ignore_errors: true
