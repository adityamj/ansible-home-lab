---
# Rootless Podman user and group
podman_user: podman
podman_group: podman

# Base directory for all persistent data
data_mount: "/srv/data"
# storage_mode must be explicitly set in inventory.
use_zpool: ""

# Base directory for app data on each host
app_data_base_path: "{{ data_mount }}/apps"
static_base_path: "{{ data_mount }}/static"

# SSH hardening
sshd_permit_root: "prohibit-password"
sshd_allow_users: []

# Supported platform and rootless namespace allocation
app_runtime_supported_debian_releases:
  - "12"
  - "13"
podman_minimum_version: "5.0.0"
podman_subid_start: 100000
podman_subid_count: 65536
