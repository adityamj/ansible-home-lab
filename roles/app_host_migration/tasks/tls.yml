---
# Target Caddy is forced to HTTP-01 while the live source relays only challenge
# requests. This probe waits for issuance without changing public DNS.
- name: Wait for a valid target certificate for every hostname from source
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --noproxy
      - '*'
      - --connect-timeout
      - '10'
      - --max-time
      - '30'
      - --resolve
      - "{{ item }}:443:{{ migration_target_address }}"
      - --output
      - /dev/null
      - "https://{{ item }}/"
  loop: "{{ migration_model.domains }}"
  delegate_to: localhost
  become: false
  register: migration_target_tls
  changed_when: false
  retries: 30
  delay: 2
  until: migration_target_tls.rc == 0
