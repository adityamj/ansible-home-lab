---
- name: Build globally visible application topology
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/inventory_topology.yml"

- name: Validate application compiler settings
  ansible.builtin.assert:
    quiet: true
    that:
      - apps_root is defined
      - apps_root is string
      - apps_root | trim | length > 0
      - apps_root.startswith('/')
      - ssh_port is defined
      - app_model_compiler_path is defined
      - app_model_compiler_path.startswith('/')
    fail_msg: "Application compiler paths and ssh_port must be configured."

- name: Inspect application compiler inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ apps_root }}"
    - "{{ app_model_compiler_path }}"
  register: app_compiler_inputs
  delegate_to: localhost
  become: false

- name: Require application compiler inputs
  ansible.builtin.assert:
    quiet: true
    that:
      - app_compiler_inputs.results[0].stat.isdir | default(false)
      - app_compiler_inputs.results[1].stat.isreg | default(false)
    fail_msg: "The application source directory or model compiler is missing."

- name: Compile application model for this host
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ app_model_compiler_path }}"
      - --apps-root
      - "{{ apps_root }}"
    stdin: >-
      {{ {
          'assigned_apps': app_model_assigned_apps | default(assigned_apps | default([])),
          'target_app': target_app | default(''),
          'ssh_port': ssh_port,
          'caddy_platform_network': caddy_platform_network | default('caddy-egress-net'),
          'app_desired_states': app_model_desired_states | default(app_desired_states | default({})),
          'draining_apps': draining_apps | default({}),
          'inventory_hosts': app_inventory_topology,
          'current_host': inventory_hostname,
          'selected_hosts': ansible_play_hosts_all | default([]),
          'defaults': {
            'memory_max': app_memory_default,
            'pids_limit': app_pids_limit_default,
            'restart_policy': app_restart_policy,
            'restart_sec': app_restart_sec,
            'healthcheck': app_healthcheck_defaults,
            'runtime_healthcheck': app_runtime_healthcheck_defaults
          }
        } | to_json }}
    stdin_add_newline: true
  register: compiled_app_model_command
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false

- name: Parse compiled application model
  ansible.builtin.set_fact:
    compiled_app_model: "{{ compiled_app_model_command.stdout | from_json }}"

- name: Require supported application model plan
  ansible.builtin.assert:
    quiet: true
    that:
      - compiled_app_model is mapping
      - compiled_app_model.version == 3
      - compiled_app_model.naming_scheme == 'dash-escape-kind-v1'
    fail_msg: "The application compiler returned an unsupported plan."

- name: Publish compiled application model facts
  ansible.builtin.set_fact:
    app_sources_root: "{{ compiled_app_model.app_sources_root }}"
    apps_list: "{{ compiled_app_model.apps_list }}"
    host_assigned_app_names: "{{ compiled_app_model.host_assigned_app_names }}"
    host_assigned_apps_digest: "{{ compiled_app_model.host_assigned_apps_digest }}"
    inventory_topology_digest: "{{ compiled_app_model.inventory_topology_digest }}"
    app_model_naming_scheme: "{{ compiled_app_model.naming_scheme }}"
    host_apps: "{{ compiled_app_model.host_apps }}"
    deployment_is_targeted: "{{ compiled_app_model.deployment_is_targeted }}"
    host_app_dependency_order: "{{ compiled_app_model.host_app_dependency_order }}"
    host_app_dependency_closures: "{{ compiled_app_model.host_app_dependency_closures }}"
    host_container_resource_names: "{{ compiled_app_model.host_container_resource_names }}"
    host_network_resource_names: "{{ compiled_app_model.host_network_resource_names }}"
    host_service_resource_names: "{{ compiled_app_model.host_service_resource_names }}"
    host_quadlet_resource_names: "{{ compiled_app_model.host_quadlet_resource_names }}"
    host_unit_resource_names: "{{ compiled_app_model.host_unit_resource_names }}"
    host_secret_resource_names: "{{ compiled_app_model.host_secret_resource_names }}"
    host_published_port_allocations: "{{ compiled_app_model.host_published_port_allocations }}"
    deploy_apps: "{{ compiled_app_model.deploy_apps }}"
    deploy_app_service_order: "{{ compiled_app_model.deploy_app_service_order }}"
    host_caddy_networks: "{{ compiled_app_model.host_caddy_networks }}"
    deploy_caddy_networks: "{{ compiled_app_model.deploy_caddy_networks }}"
