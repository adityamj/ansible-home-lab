---
# Call podman_user_facts.yml explicitly at the entry point. This helper only
# reconciles mutable manager state; it never repeats account discovery.
- name: Ensure rootless user manager is started
  ansible.builtin.systemd:
    name: "user@{{ podman_uid }}.service"
    state: started

- name: Wait for rootless user systemd bus
  ansible.builtin.stat:
    path: "/run/user/{{ podman_uid }}/bus"
  register: podman_user_bus
  until: podman_user_bus.stat.exists
  retries: 10
  delay: 1
  when: not ansible_check_mode
